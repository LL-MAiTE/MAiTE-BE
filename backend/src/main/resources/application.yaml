spring:
  application:
    name: hackathon
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

token:
  encryption-key: ${TOKEN_ENCRYPTION_KEY}

hold-item:
  # 답변 전달 후 이 시간(시간 단위)이 지나도 재오픈 안 되면 자동 확정 (명세서 24~48h 중 하한)
  timeout-hours: ${HOLD_ITEM_TIMEOUT_HOURS:24}

openai:
  api-key: ${OPENAI_API_KEY}

agora:
  app-id: ${AGORA_APP_ID}
  app-certificate: ${AGORA_APP_CERTIFICATE:}
  customer-key: ${AGORA_CUSTOMER_KEY}
  customer-secret: ${AGORA_CUSTOMER_SECRET}
  callback-url: ${AGORA_CALLBACK_URL:}
  agent-pipeline-id: ${AGORA_AGENT_PIPELINE_ID:}
  asr-resource-id: ${AGORA_ASR_RESOURCE_ID}
  tts-resource-id: ${AGORA_TTS_RESOURCE_ID}
