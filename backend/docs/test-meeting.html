<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>미팅 테스트</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.21.0.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 24px; }
    h2 { margin-bottom: 20px; color: #1a1a2e; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
    button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { background: #4338ca; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    #status { padding: 10px 14px; border-radius: 8px; font-size: 13px; background: #f3f4f6; color: #374151; margin-bottom: 12px; }
    #status.ok { background: #d1fae5; color: #065f46; }
    #status.err { background: #fee2e2; color: #991b1b; }
    #log { background: #1e1e2e; color: #cdd6f4; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-right: 4px; }
    .tag-user { background: #dbeafe; color: #1e40af; }
    .tag-ai { background: #d1fae5; color: #065f46; }
    .transcript-item { padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; }
    #transcripts { max-height: 200px; overflow-y: auto; }
    .badge { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; margin-right: 6px; }
    .badge.on { background: #10b981; }
    #participants { font-size: 13px; color: #6b7280; }

    /* 영상 영역 */
    .video-area { display: flex; gap: 16px; margin-bottom: 0; }
    .video-box { flex: 1; background: #e8eaf0; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 4/3; }
    .video-box video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 8px; left: 10px; color: #333; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.7); padding: 2px 8px; border-radius: 99px; }
    #aiBox { background: linear-gradient(160deg, #dce3f0 0%, #eef1f8 100%); }
    .ai-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity 0.08s; }
    #aiOpen { opacity: 0; }
  </style>
</head>
<body>

<h2>🎙️ AI 협상 미팅 테스트</h2>

<!-- 설정 -->
<div class="card">
  <label>백엔드 URL</label>
  <input id="baseUrl" value="http://localhost:8080" />

  <label>JWT 토큰 (로그인 후 복사)</label>
  <input id="token" placeholder="Bearer 없이 토큰만 입력" />

  <label>Meeting ID (미팅 생성 후 입력)</label>
  <input id="meetingId" placeholder="UUID" />

  <label>🔑 수동 RTC 토큰 (Agora 콘솔에서 생성한 토큰 — 비우면 백엔드 토큰 사용)</label>
  <input id="manualToken" placeholder="007... (콘솔 토큰 붙여넣기)" />

  <label>수동 채널명 (수동 토큰 사용 시 입력)</label>
  <input id="manualChannel" placeholder="demo-channel" />
</div>

<!-- 영상 통화 -->
<div class="card">
  <div class="video-area">
    <div class="video-box" id="localBox">
      <div id="localVideo" style="width:100%;height:100%;background:#111;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px;">카메라 대기 중</div>
      <div class="video-label">나</div>
    </div>
    <div class="video-box" id="aiBox">
      <img id="aiClosed" class="ai-img" src="ai-closed.png" alt="AI" />
      <img id="aiOpen"   class="ai-img" src="ai-open.png"   alt="AI speaking" />
      <div class="video-label">AI 에이전트</div>
    </div>
  </div>
</div>

<!-- 상태 -->
<div class="card">
  <div id="status">대기 중</div>
  <div id="participants"><span class="badge" id="badgeMe"></span>나 &nbsp;&nbsp; <span class="badge" id="badgeAI"></span>AI 에이전트</div>
</div>

<!-- 컨트롤 -->
<div class="card">
  <div class="btn-row">
    <button class="btn-secondary" onclick="signup()">① 회원가입</button>
    <button class="btn-secondary" onclick="login()">② 로그인</button>
    <button class="btn-secondary" onclick="createMeeting()">③ 미팅 생성</button>
    <button class="btn-primary" onclick="startMeeting()">④ 미팅 시작 (AI 입장)</button>
    <button class="btn-danger" onclick="endMeeting()">⑤ 미팅 종료</button>
  </div>
</div>

<!-- 대화 내용 -->
<div class="card">
  <b style="font-size:14px;">대화 내용</b>
  <div id="transcripts" style="margin-top:10px;">
    <div style="color:#9ca3af;font-size:13px;">미팅 시작 후 대화가 여기에 표시됩니다.</div>
  </div>
</div>

<!-- 로그 -->
<div class="card">
  <b style="font-size:14px;">API 로그</b>
  <div id="log" style="margin-top:10px;"></div>
</div>

<script>
  let client = null
  let micTrack = null
  let cameraTrack = null
  let agendaId = null

  // ── AI 아바타 (이미지 전환) ────────────────────
  let analyser = null
  let analyserData = null
  let avatarAnimId = null

  function startAvatarAnalyser(audioTrack) {
    const actx = new AudioContext()
    const src = actx.createMediaStreamSource(new MediaStream([audioTrack.getMediaStreamTrack()]))
    analyser = actx.createAnalyser()
    analyser.fftSize = 256
    analyserData = new Uint8Array(analyser.frequencyBinCount)
    src.connect(analyser)
    runAvatarLoop()
  }

  function runAvatarLoop() {
    avatarAnimId = requestAnimationFrame(runAvatarLoop)
    if (!analyser) return
    analyser.getByteFrequencyData(analyserData)
    const avg = analyserData.reduce((a, b) => a + b, 0) / analyserData.length
    const speaking = avg > 12

    let showOpen = false
    if (speaking) {
      // 볼륨 크기에 따라 속도 변화: 빠를수록 입이 더 자주 열림
      const speed = 80 + (1 - Math.min(avg / 80, 1)) * 120  // 80ms~200ms 주기
      showOpen = Math.floor(Date.now() / speed) % 2 === 0
    }
    document.getElementById('aiOpen').style.opacity   = showOpen ? '1' : '0'
    document.getElementById('aiClosed').style.opacity = showOpen ? '0' : '1'
  }

  function initAvatar() {}  // 이미지 방식은 초기화 불필요

  // ── 로그 ──────────────────────────────────────
  function log(msg, type = 'info') {
    const el = document.getElementById('log')
    const colors = { info: '#cdd6f4', ok: '#a6e3a1', err: '#f38ba8', warn: '#fab387' }
    const time = new Date().toLocaleTimeString()
    el.innerHTML += `<span style="color:${colors[type]}">[${time}] ${msg}</span>\n`
    el.scrollTop = el.scrollHeight
  }

  function setStatus(msg, type = '') {
    const el = document.getElementById('status')
    el.textContent = msg
    el.className = type
  }

  // ── 전사 ──────────────────────────────────────
  let pendingTranscript = null

  function addTranscript(speaker, text) {
    if (!text.trim()) return
    const el = document.getElementById('transcripts')
    const isAI = speaker === 'AI_AGENT'
    if (pendingTranscript && pendingTranscript.dataset.speaker === speaker) {
      pendingTranscript.querySelector('.transcript-text').textContent = text
      pendingTranscript.classList.remove('pending')
      pendingTranscript.style.opacity = '1'
      pendingTranscript = null
    } else {
      const div = document.createElement('div')
      div.className = 'transcript-item'
      div.dataset.speaker = speaker
      div.innerHTML = `<span class="tag ${isAI ? 'tag-ai' : 'tag-user'}">${isAI ? '🤖 AI' : '👤 나'}</span><span class="transcript-text">${text}</span>`
      el.appendChild(div)
      pendingTranscript = null
    }
    el.scrollTop = el.scrollHeight
  }

  function updateLastTranscript(speaker, text) {
    if (!text.trim()) return
    const el = document.getElementById('transcripts')
    const isAI = speaker === 'AI_AGENT'
    if (pendingTranscript && pendingTranscript.dataset.speaker === speaker) {
      pendingTranscript.querySelector('.transcript-text').textContent = text
    } else {
      const div = document.createElement('div')
      div.className = 'transcript-item pending'
      div.dataset.speaker = speaker
      div.style.opacity = '0.6'
      div.innerHTML = `<span class="tag ${isAI ? 'tag-ai' : 'tag-user'}">${isAI ? '🤖 AI' : '👤 나'}</span><span class="transcript-text">${text}</span>`
      el.appendChild(div)
      pendingTranscript = div
    }
    el.scrollTop = el.scrollHeight
  }

  // ── API 헬퍼 ──────────────────────────────────
  function baseUrl() { return document.getElementById('baseUrl').value }
  function token() { return document.getElementById('token').value }
  function meetingId() { return document.getElementById('meetingId').value }

  async function api(method, path, body) {
    const url = baseUrl() + path
    log(`${method} ${path}`)
    try {
      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(token() ? { 'Authorization': 'Bearer ' + token() } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      })
      const data = await res.json()
      log(JSON.stringify(data, null, 2), res.ok ? 'ok' : 'err')
      return data
    } catch (e) {
      log('Error: ' + e.message, 'err')
    }
  }

  // ── 1. 회원가입 ───────────────────────────────
  async function signup() {
    const email = prompt('이메일')
    const password = prompt('비밀번호')
    const name = prompt('이름')
    await api('POST', '/auth/signup', { email, password, name })
  }

  // ── 2. 로그인 ─────────────────────────────────
  async function login() {
    const email = prompt('이메일')
    const password = prompt('비밀번호')
    const res = await api('POST', '/auth/login', { email, password })
    if (res?.data?.token) {
      document.getElementById('token').value = res.data.token
      log('토큰 자동 입력 완료', 'ok')
    }
  }

  // ── 3. 미팅 생성 (OpenAI 호출 없이 빠르게) ────
  async function createMeeting() {
    const proj = await api('POST', '/projects', { name: '테스트 프로젝트' })
    if (!proj?.data?.id) return
    const projectId = proj.data.id

    const agenda = await api('POST', '/agendas', {
      projectId,
      title: '납품 계약 협상',
      purpose: '납품 단가 및 납기일 협의',
      counterpartCountry: '한국',
      counterpartLanguage: 'ko-KR',
      transcriptLanguages: ['ko-KR']
    })
    if (!agenda?.data?.id) return
    agendaId = agenda.data.id

    const meeting = await api('POST', `/agendas/${agendaId}/meetings`)
    if (meeting?.data?.id) {
      document.getElementById('meetingId').value = meeting.data.id
      log('미팅 생성 완료: ' + meeting.data.id, 'ok')
      setStatus('미팅 준비 완료. "미팅 시작" 버튼을 누르세요.')
    }
  }

  // ── 4. 미팅 시작 + Agora 입장 ─────────────────
  async function startMeeting() {
    const mid = meetingId()
    if (!mid) { alert('Meeting ID를 입력하세요'); return }

    const manualTok = document.getElementById('manualToken').value.trim()
    const manualCh  = document.getElementById('manualChannel').value.trim()

    setStatus('AI 에이전트 시작 중...', '')
    const res = await api('POST', `/meetings/${mid}/start`)
    if (!res?.data) return

    const agoraAppId   = res.data.agoraAppId
    const agoraChannel = manualCh || res.data.agoraChannel
    const agoraToken   = manualTok || res.data.agoraToken || null
    log(`Agora 채널 입장: appId=${agoraAppId}, channel=${agoraChannel}${manualTok ? ' [수동토큰]' : ''}`, 'ok')

    try {
      initAvatar()
      client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' })

      // 원격 사용자(AI) 입장 감지
      client.on('user-published', async (user, mediaType) => {
        await client.subscribe(user, mediaType)
        if (mediaType === 'audio') {
          user.audioTrack.play()
          startAvatarAnalyser(user.audioTrack)
          document.getElementById('badgeAI').className = 'badge on'
          log(`AI 에이전트(UID:${user.uid}) 입장 — 음성 재생 시작`, 'ok')
          setStatus('AI와 대화 중', 'ok')
        }
      })

      client.on('user-unpublished', (user, mediaType) => {
        if (mediaType === 'audio') { analyser = null }
        document.getElementById('badgeAI').className = 'badge'
        log(`AI 에이전트(UID:${user.uid}) 퇴장`, 'warn')
      })

      // 실시간 전사 (Agora ConvAI → data stream)
      // 포맷: {hex_id}|{chunk_index}|{total_chunks}|{base64_chunk}
      const chunkBuf = {}
      client.on('stream-message', (uid, data) => {
        try {
          const raw = new TextDecoder().decode(data)
          const parts = raw.split('|')
          if (parts.length < 4) return

          const msgId      = parts[0]
          const chunkIdx   = parseInt(parts[1]) - 1  // 0-based
          const totalChunks = parseInt(parts[2])
          const b64chunk   = parts[3]

          if (!chunkBuf[msgId]) chunkBuf[msgId] = new Array(totalChunks).fill(null)
          chunkBuf[msgId][chunkIdx] = b64chunk

          // 모든 청크 수신 완료 시 조립
          if (chunkBuf[msgId].some(c => c === null)) return
          const fullB64 = chunkBuf[msgId].join('')
          delete chunkBuf[msgId]

          const msg = JSON.parse(atob(fullB64))
          const obj = msg.object || ''
          const msgText = msg.text || ''
          if (!msgText) return

          const isAgent = obj.startsWith('assistant')
          const isFinal = msg.final === true || msg.is_final === true
          const speaker = isAgent ? 'AI_AGENT' : 'USER'

          if (obj === 'assistant.transcription' || obj === 'user.transcription') {
            if (isFinal) addTranscript(speaker, msgText)
            else updateLastTranscript(speaker, msgText)
          }
        } catch (e) { /* 파싱 실패 무시 */ }
      })

      // 채널 입장
      const myUid = await client.join(agoraAppId, agoraChannel, agoraToken, manualTok ? 1001 : null)
      document.getElementById('badgeMe').className = 'badge on'
      log(`내 UID: ${myUid}`, 'info')

      // 이미 채널에 있는 유저 구독
      for (const user of client.remoteUsers) {
        if (user.hasAudio) {
          await client.subscribe(user, 'audio')
          user.audioTrack.play()
          startAvatarAnalyser(user.audioTrack)
          document.getElementById('badgeAI').className = 'badge on'
          log(`AI 에이전트(UID:${user.uid}) 기존 입장 — 음성 재생`, 'ok')
          setStatus('AI와 대화 중', 'ok')
        }
      }

      // 카메라 + 마이크 발행
      cameraTrack = await AgoraRTC.createCameraVideoTrack()
      micTrack    = await AgoraRTC.createMicrophoneAudioTrack()

      // 로컬 영상 표시
      const localBox = document.getElementById('localVideo')
      localBox.innerHTML = ''
      cameraTrack.play('localVideo')

      await client.publish([cameraTrack, micTrack])
      log('카메라 + 마이크 발행 완료. AI가 입장하면 대화 시작됩니다.', 'ok')
      setStatus('AI 에이전트 입장 대기 중...')

      startLogPolling(mid)

    } catch (e) {
      log('Agora 오류: ' + e.message, 'err')
      setStatus('Agora 연결 실패', 'err')
    }
  }

  // ── 5. 미팅 종료 ──────────────────────────────
  async function endMeeting() {
    const mid = meetingId()
    await api('POST', `/meetings/${mid}/end`)
    if (cameraTrack) { cameraTrack.stop(); cameraTrack.close(); cameraTrack = null }
    if (micTrack)    { micTrack.stop();    micTrack.close();    micTrack = null }
    if (client)      { await client.leave(); client = null }
    analyser = null
    if (avatarAnimId) { cancelAnimationFrame(avatarAnimId); avatarAnimId = null }
    document.getElementById('aiOpen').style.opacity = '0'
    document.getElementById('aiClosed').style.opacity = '1'
    document.getElementById('badgeMe').className = 'badge'
    document.getElementById('badgeAI').className = 'badge'
    document.getElementById('localVideo').innerHTML = '카메라 대기 중'
    setStatus('미팅 종료')
    log('미팅 종료 완료', 'warn')
    if (pollingTimer) clearInterval(pollingTimer)
  }

  // ── 대화 내용 폴링 ────────────────────────────
  let pollingTimer = null
  let lastLogCount = 0

  function startLogPolling(mid) {
    pollingTimer = setInterval(async () => {
      try {
        const res = await fetch(`${baseUrl()}/meetings/${mid}/meeting-logs`, {
          headers: { 'Authorization': 'Bearer ' + token() }
        })
        const data = await res.json()
        if (!data?.data) return
        const logs = data.data
        if (logs.length > lastLogCount) {
          logs.slice(lastLogCount).forEach(l => {
            const speaker = l.speakerLabel || (l.translatedText ? 'AI_AGENT' : 'USER')
            addTranscript(speaker, l.transcriptText || l.translatedText || '')
          })
          lastLogCount = logs.length
        }
      } catch (e) {}
    }, 5000)
  }
</script>
</body>
</html>
